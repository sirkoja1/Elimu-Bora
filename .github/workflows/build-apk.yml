name: Build Elimu Bora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Find Elimu Bora project
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find . \
            -type f \
            -name "pubspec.yaml" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -n "$PUBSPEC" ]; then
            SOURCE_DIR=$(dirname "$PUBSPEC")
          else
            ZIP=$(find . \
              -type f \
              \( -iname "Elimu_Bora_Phone_Build_FIXED.zip" \
                 -o -iname "*.zip" \) \
              -not -path "./.git/*" \
              -print -quit)

            if [ -z "$ZIP" ]; then
              echo "ERROR: No Flutter project or ZIP found."
              exit 1
            fi

            rm -rf /tmp/elimu_extract
            mkdir -p /tmp/elimu_extract
            unzip -q "$ZIP" -d /tmp/elimu_extract

            PUBSPEC=$(find /tmp/elimu_extract \
              -type f \
              -name "pubspec.yaml" \
              -print -quit)

            if [ -z "$PUBSPEC" ]; then
              echo "ERROR: ZIP does not contain pubspec.yaml."
              exit 1
            fi

            SOURCE_DIR=$(dirname "$PUBSPEC")
          fi

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "=== Flutter project ==="
          ls -la "$SOURCE_DIR"

          if [ ! -d "$SOURCE_DIR/android" ]; then
            echo "ERROR: Original Android project is missing."
            exit 1
          fi

          echo "Original Android project FOUND."

      - name: Prepare original Elimu Bora project
        shell: bash
        run: |
          set -e

          rm -rf /tmp/elimu_project
          mkdir -p /tmp/elimu_project

          cp -a "$SOURCE_DIR"/. /tmp/elimu_project/

          echo "=== Original project copied ==="
          ls -la /tmp/elimu_project

          echo "=== Android folder ==="
          ls -la /tmp/elimu_project/android

          if [ -f "/tmp/elimu_project/android/app/google-services.json" ]; then
            echo "Firebase google-services.json FOUND."
          else
            echo "Firebase google-services.json not found."
          fi

      - name: Get Flutter dependencies
        working-directory: /tmp/elimu_project
        run: |
          set -e
          flutter --version
          flutter clean
          flutter pub get

      - name: Check Android configuration
        working-directory: /tmp/elimu_project
        shell: bash
        run: |
          set -e

          echo "=== Gradle files ==="
          find android -maxdepth 4 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print

          echo "=== Gradle wrapper ==="
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            cat android/gradle/wrapper/gradle-wrapper.properties
          fi

          echo "=== Android manifest ==="
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -n '1,220p' android/app/src/main/AndroidManifest.xml
          fi

      - name: Analyze Android compatibility
        working-directory: /tmp/elimu_project
        run: |
          set -e
          flutter analyze --suggestions || true

      - name: Build release APK
        working-directory: /tmp/elimu_project
        run: |
          set -e
          flutter build apk --release

      - name: Show APK information
        working-directory: /tmp/elimu_project
        run: |
          set -e
          ls -lh build/app/outputs/flutter-apk/
          file build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elimu-bora-apk-fixed
          path: /tmp/elimu_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
