name: Build Elimu Bora APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Locate Elimu Bora source
        run: |
          echo "Repository contents:"
          ls -la
          echo "Searching for pubspec.yaml..."
          find . -name pubspec.yaml -not -path './.git/*'

      - name: Prepare Flutter project
        run: |
          mkdir -p /tmp/elimu_source

          if [ -f "source/elimu_bora/pubspec.yaml" ]; then
            cp -r source/elimu_bora/. /tmp/elimu_source/
          elif [ -f "pubspec.yaml" ]; then
            cp -r . /tmp/elimu_source/
          else
            echo "ERROR: Could not find pubspec.yaml"
            exit 1
          fi

          flutter create \
            --platforms=android \
            --org=com.elimubora \
            /tmp/elimu_project

          cp -r /tmp/elimu_source/. /tmp/elimu_project/

          cd /tmp/elimu_project

          echo "Flutter project:"
          ls -la

      - name: Get dependencies
        working-directory: /tmp/elimu_project
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/elimu_project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elimu-bora-apk
          path: /tmp/elimu_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
