 name: Build Elimu Bora APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Extract FIXED Elimu Bora project
        shell: bash
        run: |
          set -e

          ZIP="./Elimu_Bora_Phone_Build_FIXED.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found."
            exit 1
          fi

          echo "Using: $ZIP"

          rm -rf /tmp/elimu_extract
          mkdir -p /tmp/elimu_extract

          unzip -q "$ZIP" -d /tmp/elimu_extract

          echo "=== Searching for Flutter project ==="

          PUBSPEC=$(find /tmp/elimu_extract \
            -type f \
            -name "pubspec.yaml" \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml was not found."
            exit 1
          fi

          SOURCE_DIR=$(dirname "$PUBSPEC")

          echo "Found project at:"
          echo "$SOURCE_DIR"

          if [ ! -d "$SOURCE_DIR/android" ]; then
            echo "ERROR: Android project folder was not found."
            exit 1
          fi

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "=== Project contents ==="
          ls -la "$SOURCE_DIR"

      - name: Get Flutter dependencies
        working-directory: /tmp/elimu_extract
        shell: bash
        run: |
          set -e
          cd "$SOURCE_DIR"
          flutter pub get

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "=== Android files ==="
          find "$SOURCE_DIR/android" -maxdepth 3 -type f | head -100

          echo "=== Checking Gradle files ==="

          if [ -f "$SOURCE_DIR/android/app/build.gradle.kts" ]; then
            echo "Using build.gradle.kts"
          elif [ -f "$SOURCE_DIR/android/app/build.gradle" ]; then
            echo "Using build.gradle"
          else
            echo "ERROR: Android app Gradle file not found."
            exit 1
          fi

      - name: Build release APK
        shell: bash
        run: |
          set -e

          cd "$SOURCE_DIR"

          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$SOURCE_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elimu-bora-apk-fixed
          path: ${{ env.SOURCE_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error   
