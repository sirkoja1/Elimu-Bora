name: Diagnose Elimu Bora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Prepare project
        shell: bash
        run: |
          set -e

          rm -rf /tmp/elimu_project
          rm -rf /tmp/elimu_zip

          mkdir -p /tmp/elimu_project

          if [ -f "pubspec.yaml" ]; then
            cp -a . /tmp/elimu_project/
          elif [ -f "Elimu_Bora_Phone_Build_FIXED.zip" ]; then
            mkdir -p /tmp/elimu_zip
            unzip -q "Elimu_Bora_Phone_Build_FIXED.zip" -d /tmp/elimu_zip
            PROJECT=$(find /tmp/elimu_zip -name pubspec.yaml -type f | head -1 | xargs dirname)
            test -n "$PROJECT"
            cp -a "$PROJECT"/. /tmp/elimu_project/
          elif [ -f "Elimu_Bora_Phone_Build.zip" ]; then
            mkdir -p /tmp/elimu_zip
            unzip -q "Elimu_Bora_Phone_Build.zip" -d /tmp/elimu_zip
            PROJECT=$(find /tmp/elimu_zip -name pubspec.yaml -type f | head -1 | xargs dirname)
            test -n "$PROJECT"
            cp -a "$PROJECT"/. /tmp/elimu_project/
          else
            echo "Elimu Bora project not found."
            exit 1
          fi

          test -f /tmp/elimu_project/pubspec.yaml
          test -d /tmp/elimu_project/android

      - name: Backup original Android
        working-directory: /tmp/elimu_project
        shell: bash
        run: |
          set -e
          cp -a android /tmp/android_original

      - name: Create modern Android project
        shell: bash
        run: |
          set -e

          rm -rf /tmp/android_template

          flutter create \
            --platforms=android \
            --project-name=elimu_bora \
            --org=com.elimubora \
            /tmp/android_template

          test -d /tmp/android_template/android

          rm -rf /tmp/elimu_project/android
          cp -a /tmp/android_template/android /tmp/elimu_project/android

      - name: Restore original Android files
        working-directory: /tmp/elimu_project
        shell: bash
        run: |
          set -e

          ORIGINAL=/tmp/android_original
          TEMPLATE=/tmp/android_template/android

          rm -rf android/app/src/main
          cp -a "$ORIGINAL/app/src/main" android/app/src/main

          if [ -d "$ORIGINAL/app/src/debug" ]; then
            rm -rf android/app/src/debug
            cp -a "$ORIGINAL/app/src/debug" android/app/src/debug
          fi

          if [ -d "$ORIGINAL/app/src/profile" ]; then
            rm -rf android/app/src/profile
            cp -a "$ORIGINAL/app/src/profile" android/app/src/profile
          fi

          if [ -f "$ORIGINAL/app/google-services.json" ]; then
            cp "$ORIGINAL/app/google-services.json" android/app/google-services.json
          fi

          mkdir -p android/app/src/main/res

          for DIR in "$TEMPLATE"/app/src/main/res/mipmap*; do
            if [ -d "$DIR" ]; then
              NAME=$(basename "$DIR")
              rm -rf "android/app/src/main/res/$NAME"
              cp -a "$DIR" "android/app/src/main/res/$NAME"
            fi
          done

      - name: Set package
        working-directory: /tmp/elimu_project
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          text = text.replace(
              'namespace = "com.elimubora.elimu_bora"',
              'namespace = "com.elimubora.app"'
          )

          text = text.replace(
              'applicationId = "com.elimubora.elimu_bora"',
              'applicationId = "com.elimubora.app"'
          )

          p.write_text(text)
          PY

      - name: Add themes
        working-directory: /tmp/elimu_project
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/elimu_bora_themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="LaunchTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>

              <style name="NormalTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>

          </resources>
          EOF

      - name: Configure Firebase
        working-directory: /tmp/elimu_project
        shell: bash
        run: |
          set -e

          if [ -f android/app/google-services.json ]; then
            python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          s = settings.read_text()
          a = app.read_text()

          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false',
                  1
              )

          if "com.google.gms.google-services" not in a:
              a = a.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1
              )

          settings.write_text(s)
          app.write_text(a)
          PY
          fi

      - name: Get dependencies
        working-directory: /tmp/elimu_project
        shell: bash
        run: |
          set -e
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: /tmp/elimu_project
        shell: bash
        run: |
          set -e
          flutter build apk --release

          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Test APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -e

            echo "===== Installing APK ====="
            adb install -r /tmp/elimu_project/build/app/outputs/flutter-apk/app-release.apk

            echo "===== Clearing old log ====="
            adb logcat -c

            echo "===== Launching Elimu Bora ====="
            adb shell monkey -p com.elimubora.app 1

            echo "===== Waiting for application ====="
            sleep 30

            echo "===== Package status ====="
            adb shell dumpsys package com.elimubora.app | head -80

            echo "===== Flutter process ====="
            adb shell pidof com.elimubora.app || true

            echo "===== Logcat ====="
            adb logcat -d -v time > /tmp/elimu_logcat.txt

            echo "===== Relevant errors ====="
            grep -iE "FATAL EXCEPTION|AndroidRuntime|flutter|exception|error|crash|firebase|Unable to start|ActivityTaskManager" /tmp/elimu_logcat.txt | tail -200 || true

            echo "===== Screenshot ====="
            adb exec-out screencap -p > /tmp/elimu_screen.png

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elimu-bora-diagnostic
          path: |
            /tmp/elimu_logcat.txt
            /tmp/elimu_screen.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elimu-bora-apk-diagnostic
          path: /tmp/elimu_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
