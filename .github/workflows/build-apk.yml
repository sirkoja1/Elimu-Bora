name: Build Elimu Bora APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Find project
        run: |
          set -e
          if [ -f pubspec.yaml ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            mkdir -p /tmp/source
            if [ -f Elimu_Bora_Phone_Build_FIXED.zip ]; then
              unzip -q Elimu_Bora_Phone_Build_FIXED.zip -d /tmp/source
            elif [ -f Elimu_Bora_Phone_Build.zip ]; then
              unzip -q Elimu_Bora_Phone_Build.zip -d /tmp/source
            else
              unzip -q Elimu_Bora_GitHub_READY.zip -d /tmp/source
            fi
            echo "PROJECT_DIR=$(dirname "$(find /tmp/source -name pubspec.yaml -type f | head -1)")" >> "$GITHUB_ENV"
          fi

      - name: Save original Android
        run: |
          set -e
          cd "$PROJECT_DIR"
          cp -a android /tmp/original_android

      - name: Generate modern Android
        run: |
          set -e
          flutter create --platforms=android --project-name=elimu_bora --org=com.elimubora /tmp/android_new

      - name: Replace Android and restore resources
        run: |
          set -e
          cd "$PROJECT_DIR"

          rm -rf /tmp/generated_res
          mkdir -p /tmp/generated_res
          cp -a /tmp/android_new/android/app/src/main/res/. /tmp/generated_res/

          rm -rf android
          cp -a /tmp/android_new/android .

          rm -rf android/app/src/main
          mkdir -p android/app/src/main
          cp -a /tmp/original_android/app/src/main/. android/app/src/main/

          mkdir -p android/app/src/main/res

          cp -a /tmp/generated_res/drawable* android/app/src/main/res/ 2>/dev/null || true
          cp -a /tmp/generated_res/mipmap* android/app/src/main/res/ 2>/dev/null || true

          cp /tmp/original_android/app/google-services.json android/app/ 2>/dev/null || true

      - name: Add themes
        run: |
          set -e
          cd "$PROJECT_DIR"
          mkdir -p android/app/src/main/res/values

          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<resources>' \
          '<style name="LaunchTheme" parent="@android:style/Theme.Material.Light.NoActionBar">' \
          '<item name="android:windowBackground">@android:color/white</item>' \
          '<item name="android:windowNoTitle">true</item>' \
          '</style>' \
          '<style name="NormalTheme" parent="@android:style/Theme.Material.Light.NoActionBar">' \
          '<item name="android:windowBackground">@android:color/white</item>' \
          '</style>' \
          '</resources>' \
          > android/app/src/main/res/values/elimu_bora_themes.xml

      - name: Configure package
        run: |
          set -e
          cd "$PROJECT_DIR"

          sed -i 's/namespace = "[^"]*"/namespace = "com.elimubora.app"/' android/app/build.gradle.kts
          sed -i 's/applicationId = "[^"]*"/applicationId = "com.elimubora.app"/' android/app/build.gradle.kts

      - name: Configure Firebase
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f android/app/google-services.json ]; then
            sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.3" apply false' android/settings.gradle.kts
            sed -i '/^plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          fi

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elimu-bora-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
