name: Build Elimu Bora APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Elimu Bora project
        run: |
          set -e
          mkdir project
          unzip -q Elimu_Bora_GitHub_READY.zip -d project

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Complete Android project
        working-directory: project
        run: |
          set -e
          flutter create --project-name elimu_bora --org com.elimubora --platforms=android .
          cp lib/main.dart /tmp/main.dart
          cp /tmp/main.dart lib/main.dart

      - name: Install dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elimu-bora-release
          path: project/build/app/outputs/flutter-apk/app-release.apk
