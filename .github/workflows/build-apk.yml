name: Diagnose Elimu Bora APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Find Elimu Bora project
        shell: bash
        run: |
          set -e

          if [ -f "pubspec.yaml" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          mkdir -p /tmp/elimu_source

          if [ -f "Elimu_Bora_Phone_Build_FIXED.zip" ]; then
            unzip -q "Elimu_Bora_Phone_Build_FIXED.zip" -d /tmp/elimu_source
          elif [ -f "Elimu_Bora_Phone_Build.zip" ]; then
            unzip -q "Elimu_Bora_Phone_Build.zip" -d /tmp/elimu_source
          elif [ -f "Elimu_Bora_GitHub_READY.zip" ]; then
            unzip -q "Elimu_Bora_GitHub_READY.zip" -d /tmp/elimu_source
          else
            echo "No Elimu Bora ZIP file found."
            exit 1
          fi

          PROJECT=$(find /tmp/elimu_source -name pubspec.yaml -type f | head -1 | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "Could not find pubspec.yaml."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT"

      - name: Backup original Android files
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -d android ]; then
            cp -a android /tmp/original_android
            echo "Original Android folder backed up."
          else
            echo "No original Android folder found."
          fi

      - name: Create modern Android Gradle project
        shell: bash
        run: |
          set -e

          rm -rf /tmp/android_template

          flutter create \
            --platforms=android \
            --project-name=elimu_bora \
            --org=com.elimubora \
            /tmp/android_template

          rm -rf "$PROJECT_DIR/android"
          cp -a /tmp/android_template/android "$PROJECT_DIR/android"

      - name: Restore original Android resources
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -d /tmp/original_android/app/src/main ]; then

            # Save modern launcher icons generated by Flutter.
            mkdir -p /tmp/generated_mipmaps

            for d in android/app/src/main/res/mipmap*; do
              if [ -d "$d" ]; then
                cp -a "$d" /tmp/generated_mipmaps/
              fi
            done

            # Restore the original application resources and native code.
            rm -rf android/app/src/main
            cp -a /tmp/original_android/app/src/main android/app/

            # Restore modern launcher icons so Android can find ic_launcher.
            for d in /tmp/generated_mipmaps/mipmap*; do
              if [ -d "$d" ]; then
                cp -a "$d" android/app/src/main/res/
              fi
            done

            # Restore Firebase configuration if the original project had it.
            if [ -f /tmp/original_android/app/google-services.json ]; then
              cp -f /tmp/original_android/app/google-services.json android/app/google-services.json
            fi
          fi

      - name: Add required Android themes
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/elimu_bora_themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="LaunchTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:fontFamily">sans</item>
              </style>

              <style name="NormalTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>

          </resources>
          EOF

      - name: Configure package name
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          sed -i 's/namespace = "[^"]*"/namespace = "com.elimubora.app"/' \
            android/app/build.gradle.kts

          sed -i 's/applicationId = "[^"]*"/applicationId = "com.elimubora.app"/' \
            android/app/build.gradle.kts

      - name: Configure Google Services
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f android/app/google-services.json ]; then
            echo "Firebase configuration found."

            if ! grep -q 'com.google.gms.google-services' android/settings.gradle.kts; then
              sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.3" apply false' android/settings.gradle.kts
            fi

            if ! grep -q 'com.google.gms.google-services' android/app/build.gradle.kts; then
              sed -i '/^plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
            fi
          else
            echo "No google-services.json found. Continuing without Google Services."
          fi

      - name: Flutter pub get
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get
          flutter build apk --release

          mkdir -p /tmp/elimu_apk
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/elimu_apk/app-release.apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test APK on Android emulator
        id: emulator_test
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim"
          disable-animations: true
          script: |
            set +e

            echo "Installing Elimu Bora APK..."
            adb install -r /tmp/elimu_apk/app-release.apk

            echo "Clearing previous logcat..."
            adb logcat -c

            echo "Starting Elimu Bora..."
            adb shell am force-stop com.elimubora.app
            adb shell monkey -p com.elimubora.app 1

            echo "Waiting 45 seconds..."
            sleep 45

            echo "========== PACKAGE =========="
            adb shell pm list packages | grep elimubora

            echo "========== PROCESS =========="
            adb shell pidof com.elimubora.app

            echo "========== ACTIVITY =========="
            adb shell dumpsys activity activities | grep -i elimubora | tail -30

            echo "========== LOGCAT =========="
            adb logcat -d -v time > /tmp/elimu_logcat.txt

            echo "========== IMPORTANT ERRORS =========="
            grep -iE "FATAL EXCEPTION|AndroidRuntime|flutter|exception|crash|error|firebase|google" \
              /tmp/elimu_logcat.txt | tail -200 > /tmp/elimu_errors.txt || true

            echo "========== SCREENSHOT =========="
            adb exec-out screencap -p > /tmp/elimu_screenshot.png

            echo "Test completed."

      - name: Collect diagnostic files
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostic

          if [ -f /tmp/elimu_logcat.txt ]; then
            cp /tmp/elimu_logcat.txt diagnostic/
          fi

          if [ -f /tmp/elimu_errors.txt ]; then
            cp /tmp/elimu_errors.txt diagnostic/
          fi

          if [ -f /tmp/elimu_screenshot.png ]; then
            cp /tmp/elimu_screenshot.png diagnostic/
          fi

          echo "Diagnostic collection finished."

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elimu-bora-diagnostic
          path: diagnostic/
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elimu-bora-apk-diagnostic
          path: /tmp/elimu_apk/app-release.apk
          if-no-files-found: error
