name: Build Elimu Bora APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q Elimu_Bora_Phone_Build.zip -d extracted

      - name: Find Flutter project
        run: |
          PROJECT=$(dirname "$(find extracted -name pubspec.yaml | head -1)")
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: ${{ env.PROJECT }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elimu-Bora-APK
          path: ${{ env.PROJECT }}/build/app/outputs/flutter-apk/app-release.apk
