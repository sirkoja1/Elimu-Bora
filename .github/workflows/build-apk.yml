 name: Build Elimu Bora APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Find Flutter project
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name pubspec.yaml -not -path './fresh/*' | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Flutter project at: $PROJECT_DIR"

      - name: Create fresh Android project
        run: |
          flutter create fresh
          
      - name: Copy Elimu Bora source
        shell: bash
        run: |
          cp "$PROJECT_DIR/pubspec.yaml" fresh/pubspec.yaml
          rm -rf fresh/lib
          cp -r "$PROJECT_DIR/lib" fresh/lib

          if [ -d "$PROJECT_DIR/assets" ]; then
            rm -rf fresh/assets
            cp -r "$PROJECT_DIR/assets" fresh/assets
          fi

      - name: Get Flutter packages
        working-directory: fresh
        run: flutter pub get

      - name: Build APK
        working-directory: fresh
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elimu-bora-apk
          path: fresh/build/app/outputs/flutter-apk/app-release.apk      
