name: Build Elimu Bora APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Elimu Bora
        run: |
          unzip -q Elimu_Bora_Phone_Build.zip -d extracted
          PROJECT=$(dirname "$(find extracted -name pubspec.yaml | head -1)")
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Replace old Android project
        working-directory: ${{ env.PROJECT }}
        run: |
          cp android/app/google-services.json /tmp/google-services.json

          flutter create \
            --no-pub \
            --platforms=android \
            --org com.elimubora \
            --project-name app \
            /tmp/flutter_template

          rm -rf android
          cp -R /tmp/flutter_template/android android

          cp /tmp/google-services.json android/app/google-services.json

      - name: Get dependencies
        working-directory: ${{ env.PROJECT }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elimu-Bora-APK
          path: ${{ env.PROJECT }}/build/app/outputs/flutter-apk/app-release.apk
