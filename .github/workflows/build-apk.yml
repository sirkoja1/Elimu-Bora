name: Build Elimu Bora APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Elimu Bora source
        run: |
          set -e
          rm -rf source fresh
          mkdir source
          unzip -q Elimu_Bora_GitHub_READY.zip -d source

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create fresh Flutter Android project
        run: |
          set -e
          flutter create -t app --org com.elimubora --project-name elimu_bora --platforms android fresh

          cp -r source/lib fresh/lib
          cp source/pubspec.yaml fresh/pubspec.yaml

          if [ -f source/android/app/google-services.json ]; then
            cp source/android/app/google-services.json fresh/android/app/google-services.json
          fi

          sed -i "/id ['\"]com.android.application['\"]/a\    id 'com.google.gms.google-services'" fresh/android/app/build.gradle

          sed -i "/id ['\"]com.android.application['\"].*apply false/a\    id 'com.google.gms.google-services' version '4.4.3' apply false" fresh/android/settings.gradle

      - name: Install dependencies
        working-directory: fresh
        run: flutter pub get

      - name: Build APK
        working-directory: fresh
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elimu-bora-release
          path: fresh/build/app/outputs/flutter-apk/app-release.apk
